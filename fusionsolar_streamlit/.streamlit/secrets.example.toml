# Copy this file to .streamlit/secrets.toml and fill real values.
# Do NOT commit .streamlit/secrets.toml.

[fusion]
base_url = "https://eu5.fusionsolar.huawei.com"
username = "YOUR_NORTHBOUND_USERNAME"
system_code = "YOUR_NORTHBOUND_PASSWORD"
--station_code = "NE-XXXXXXXX"      # optional convenience if you know it
verify_ssl = false                # ← set to true for production
timeout_seconds = 30

# Optional corporate proxy config (uncomment and edit if needed)
# [fusion.proxies]
# https = "http://proxy.company.com:8080"
# http  = "http://proxy.company.com:8080"